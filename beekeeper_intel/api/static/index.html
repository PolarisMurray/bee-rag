<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beekeeper Research Intelligence Platform</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        background: #0f1115;
        color: #e6e6e6;
      }
      .wrap {
        max-width: 980px;
        margin: 28px auto;
        padding: 0 18px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.3rem;
      }
      .card {
        background: #171a21;
        border: 1px solid #252a35;
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 14px;
      }
      textarea, input, select {
        width: 100%;
        margin-top: 8px;
        box-sizing: border-box;
        border-radius: 8px;
        border: 1px solid #303747;
        background: #11141b;
        color: #e6e6e6;
        padding: 10px;
      }
      textarea {
        min-height: 110px;
        resize: vertical;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      button {
        margin-top: 10px;
        background: #3d7eff;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #0f1115;
        border: 1px solid #252a35;
        border-radius: 8px;
        padding: 10px;
        margin: 0;
      }
      .muted {
        color: #9aa3b5;
        font-size: 0.9rem;
      }
      @media (max-width: 760px) {
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Beekeeper Research Intelligence Platform</h1>
      <div class="muted">Interactive debug UI for query and research report endpoints.</div>

      <div class="card">
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="query">Conversational Q&A</option>
          <option value="report">Research Report</option>
        </select>

        <label for="query">Query</label>
        <textarea id="query" placeholder="Ask about beekeeper pain points, workflows, unmet needs..."></textarea>

        <div class="row">
          <div>
            <label for="session">Session ID</label>
            <input id="session" placeholder="demo-session-1" />
          </div>
          <div>
            <label for="user">User ID (optional)</label>
            <input id="user" placeholder="alex" />
          </div>
        </div>

        <div class="row">
          <div>
            <label for="llmProvider">LLM Provider</label>
            <select id="llmProvider">
              <option value="openai">OpenAI</option>
              <option value="deepseek" selected>DeepSeek</option>
            </select>
          </div>
          <div>
            <label for="llmModel">Model</label>
            <input id="llmModel" placeholder="deepseek-chat" />
          </div>
        </div>

        <label for="llmKey">LLM API Key (per request)</label>
        <input id="llmKey" type="password" placeholder="Paste key here..." />

        <button id="runBtn">Run</button>
      </div>

      <div class="card">
        <div class="muted">Response</div>
        <pre id="out">No request yet.</pre>
      </div>
    </div>

    <script>
      const runBtn = document.getElementById("runBtn");
      const out = document.getElementById("out");

      async function run() {
        const mode = document.getElementById("mode").value;
        const query = document.getElementById("query").value.trim();
        const sessionId = document.getElementById("session").value.trim();
        const userId = document.getElementById("user").value.trim();
        const llmProvider = document.getElementById("llmProvider").value;
        const llmModel = document.getElementById("llmModel").value.trim();
        const llmKey = document.getElementById("llmKey").value.trim();

        if (!query) {
          out.textContent = "Please enter a query.";
          return;
        }

        const endpoint = mode === "report" ? "/research/report" : "/query";
        const payload = {
          query,
          include_trace: true,
        };
        if (sessionId) payload.session_id = sessionId;
        if (userId) payload.user_id = userId;
        if (llmKey) {
          payload.llm_provider = llmProvider;
          payload.llm_api_key = llmKey;
          if (llmModel) payload.llm_model = llmModel;
        }

        runBtn.disabled = true;
        out.textContent = "Running...";
        try {
          const res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          out.textContent = JSON.stringify(data, null, 2);
        } catch (err) {
          out.textContent = "Request failed: " + (err?.message || String(err));
        } finally {
          runBtn.disabled = false;
        }
      }

      runBtn.addEventListener("click", run);
    </script>
  </body>
</html>
